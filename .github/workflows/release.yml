name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SPIRIT_KS_PASS: ${{ secrets.SPIRIT_KS_PASS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore keystore from secret
        env:
          SPIRIT_KS_B64: ${{ secrets.SPIRIT_KS_B64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$SPIRIT_KS_B64" | tr -d '[:space:]' > /tmp/ks.b64
          echo "secret: $(wc -c < /tmp/ks.b64) chars (esperado 3616)"
          BAD=$(tr -d 'A-Za-z0-9+/=' < /tmp/ks.b64 | fold -w1 | sort -u | tr -d '\n')
          if [ -n "$BAD" ]; then
            echo "ERRO: caracteres fora do base64 no secret: [$BAD]"
            exit 1
          fi
          base64 -d /tmp/ks.b64 > keystore/spirit.keystore
          printf 'storeFile=keystore/spirit.keystore\nkeyAlias=spirit\n' > keystore.properties
          keytool -list -v -keystore keystore/spirit.keystore \
            -storepass "$SPIRIT_KS_PASS" -alias spirit | grep -E 'Owner|SHA256'

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PversionName="${GITHUB_REF_NAME#v}" --console=plain

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true