plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ksProps = new Properties()
def ksPropsFile = rootProject.file('keystore.properties')
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}
def spiritKs = rootProject.file(ksProps.getProperty('storeFile', 'keystore/spirit.keystore'))

def releasePassword = {
    // Senha de release: prefira a variável de ambiente SPIRIT_KS_PASS.
    // O keystore.properties contém a senha em texto plano (risco se vazar);
    // mantemos o fallback apenas para compatibilidade com builds locais.
    def senha = System.getenv('SPIRIT_KS_PASS')
    if (senha == null || senha.isEmpty()) {
        senha = ksProps.getProperty('storePassword')
        if (senha != null && !senha.isEmpty()) {
            println 'AVISO: usando storePassword de keystore.properties (texto plano). Prefira SPIRIT_KS_PASS.'
        }
    }
    if (senha == null || senha.isEmpty()) {
        throw new GradleException(
            'Senha do keystore ausente. Defina a variável de ambiente SPIRIT_KS_PASS'
            + ' ou a propriedade storePassword em keystore.properties.'
        )
    }
    senha
}

/** Mesmo cálculo do passo "Derive versionCode from tag" da release.yml:
 * MAJOR*10000 + MINOR*100 + PATCH, para builds locais e da CI concordarem. */
def versionCodeFrom = { String nome ->
    def p = nome.tokenize('.')
    def maj = p.size() > 0 ? p[0] : '0'
    def min = p.size() > 1 ? p[1] : '0'
    def pat = p.size() > 2 ? p[2] : '0'
    if (!(maj ==~ /\d+/ && min ==~ /\d+/ && pat ==~ /\d+/)) {
        throw new GradleException("ERRO: versionName nao permite calcular versionCode: [$nome]")
    }
    if (min.toInteger() >= 100 || pat.toInteger() >= 100) {
        throw new GradleException("ERRO: minor e patch devem ser < 100 para o calculo: [$nome]")
    }
    maj.toInteger() * 10000 + min.toInteger() * 100 + pat.toInteger()
}

android {
    namespace 'com.spiritbox.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.spiritbox.app"
        minSdk 24
        targetSdk 35
        // A CI sempre passa -PversionCode/-PversionName a partir da tag. Localmente
        // o versionCode sai do versionName pela mesma fórmula da tag, e não de um
        // contador manual: com um contador baixo (era 9) nenhum build local conseguia
        // atualizar por cima de uma release da CI, que já vai para 10800+.
        def nome = project.findProperty('versionName') as String ?: '1.26'
        versionName nome
        versionCode ((project.findProperty('versionCode') as String ?: versionCodeFrom(nome)).toInteger())
    }

    signingConfigs {
        release {
            if (spiritKs.exists()) {
                def senhaKs = releasePassword()
                storeFile spiritKs
                storePassword senhaKs
                keyAlias ksProps.getProperty('keyAlias', 'spirit')
                keyPassword senhaKs
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (spiritKs.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly files('libs/radio-stub.jar')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.neovisionaries:nv-websocket-client:2.14'
    testImplementation 'junit:junit:4.13.2'
}