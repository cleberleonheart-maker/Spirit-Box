name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SPIRIT_KS_PASS: ${{ secrets.SPIRIT_KS_PASS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore keystore from secret
        run: |
          mkdir -p keystore
          echo "${{ secrets.SPIRIT_KS_B64 }}" | base64 -d > keystore/spirit.keystore
          printf 'storeFile=keystore/spirit.keystore\nkeyAlias=spirit\n' > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PversionName="${GITHUB_REF_NAME#v}" --console=plain

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true